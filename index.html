<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurevane Media</title>
<style>
  :root{
    --bg:#07130f; --card:#0d1f18; --ink:#f1ece0; --muted:#9fb3a8; --line:#1f3a2e;
    --accent:#d4af5f; --accent-soft:#16301f; --gold:#d4af5f; --ok:#5cc68a; --warn:#e0a13a; --bad:#f0857d;
    --bar:#2c5a45; --bar-lead:#d4af5f;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#0f2a20 0,var(--bg) 70%) no-repeat,var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent)}
  header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}
  h1{margin:0;font-family:var(--serif);font-size:2rem;letter-spacing:.01em;font-weight:600;color:var(--gold)}
  h1 small{display:block;font:600 .7rem/1 system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  h2,.card h3,.col h3{font-family:var(--serif)}
  header{border-top:0}
  .tag{margin:4px 0 0;color:var(--muted);font-size:.95rem}
  .bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px;font-size:.85rem;color:var(--muted)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:baseline}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  nav{max-width:1100px;margin:8px auto 0;padding:0 16px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .notice{background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:.9rem;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .card h3{margin:0 0 4px;font-size:1.02rem}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .muted{color:var(--muted)} .small{font-size:.85rem}
  h2{font-size:1.15rem;margin:22px 0 8px}
  .cand{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:8px 0}
  .cand .nm{font-weight:500}
  .cand .meter{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .cand .fill{height:100%;background:var(--bar)} .cand.lead .fill{background:var(--bar-lead)}
  .pill{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);color:#07130f;border-color:var(--accent);font-weight:600}
  input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;min-width:200px}
  .cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));align-items:start}
  .col h3{font-size:.95rem;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--line)}
  .item{padding:8px 0;border-bottom:1px solid var(--line)} .item:last-child{border-bottom:0}
  .item a{color:var(--ink);text-decoration:none;font-weight:500} .item a:hover{text-decoration:underline}
  .item .meta{font-size:.78rem;color:var(--muted);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .tile .big{font-size:2rem;font-weight:700;line-height:1.1}
  footer{max-width:1100px;margin:10px auto 40px;padding:0 16px;color:var(--muted);font-size:.82rem}
  button.link{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
  details{margin:10px 0} summary{cursor:pointer;padding:6px 0;font-size:1.02rem}
  select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
  .topbar{border-bottom:1px solid var(--line);background:#050e0b;font:.78rem/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
  .topbar div{max-width:1100px;margin:0 auto;padding:11px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}
  .topbar .mid{color:var(--gold)}
  nav{overflow-x:auto;white-space:nowrap;flex-wrap:nowrap}
  .calc{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:end}
  .calc input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  .result{border:1px solid var(--gold);border-radius:10px;padding:12px 16px;margin-top:12px}
  .result .big{font:600 1.5rem/1.2 var(--serif);color:var(--gold)}
  .clock{max-width:1100px;margin:14px auto 0;padding:0 16px}
  .clockbox{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;border:1px solid var(--gold);border-radius:10px;padding:12px 16px;background:linear-gradient(90deg,#0d1f18,#0a1a14)}
  .clockbox .big{font:600 1.7rem/1.1 var(--serif);color:var(--gold)}
  .clockbox .lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .upd{margin:0;padding:0;list-style:none} .upd li{padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
  .upd li:last-child{border-bottom:0} .upd time{color:var(--gold);font-size:.78rem;margin-right:8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="topbar"><div><span id="tbTime">Central time</span><span class="mid" id="tbUpd">Loading…</span><span>Election Day: November 3, 2026</span></div></div>
<header>
  <h1><small>Live election desk</small><span id="siteName">Aurevane Media</span></h1>
  <p class="tag" id="siteTag"></p>
  <div class="bar">
    <span><span class="dot" id="dot"></span><span id="fresh">Loading…</span></span>
    <span id="next"></span>
    <button class="link" id="refreshNow">Refresh now</button>
  </div>
</header>
<div class="clock"><div class="clockbox" id="clockbox"></div></div>

<nav role="tablist" aria-label="Sections">
  <button role="tab" data-tab="north-dakota">North Dakota</button>
  <button role="tab" data-tab="national">National &amp; Senate/House</button>
  <button role="tab" data-tab="highered">Higher Ed</button>
  <button role="tab" data-tab="ai">AI &amp; Data</button>
  <button role="tab" data-tab="compare">Compare coverage</button>
  <button role="tab" data-tab="updates">Updates</button>
  <button role="tab" data-tab="voting">Voting</button>
  <button role="tab" data-tab="sources">Sources &amp; method</button>
</nav>

<main>
  <section id="tab-north-dakota" hidden></section>
  <section id="tab-national" hidden></section>
  <section id="tab-highered" hidden></section>
  <section id="tab-ai" hidden></section>
  <section id="tab-compare" hidden></section>
  <section id="tab-updates" hidden></section>
  <section id="tab-voting" hidden></section>
  <section id="tab-sources" hidden></section>
</main>

<footer>
  Results shown here are unofficial until certified by election officials. Headlines link to the original publishers; we show no article text.
  <span id="contact"></span>
</footer>

<script>
const REFRESH_SECONDS = 60;
const TABS = ['north-dakota','national','highered','ai','compare','updates','voting','sources'];
const S = { site:null, races:null, news:null, status:null, nd:null, national:null,
            topic:'All', electionOnly:true, q:'', ndq:'', loadedAt:null, county:'', open:{} };
let _saved=null; try{ _saved = localStorage.getItem('md-county'); }catch(_){}
if(_saved !== null) S.county = _saved;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
const fmt = n => (n ?? 0).toLocaleString('en-US');

async function getJSON(path){
  try{
    const r = await fetch(path + (path.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'});
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }
}
function ago(iso){
  if(!iso) return 'never';
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/1000));
  if(s < 60) return s + 's ago';
  if(s < 3600) return Math.round(s/60) + ' min ago';
  if(s < 86400) return Math.round(s/3600) + ' h ago';
  return Math.round(s/86400) + ' d ago';
}
function clock(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleString('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) + ' CT';
}

async function loadAll(){
  const [site, races, news, status, nd, national] = await Promise.all([
    getJSON('config/site.json'), getJSON('config/races.json'), getJSON('data/news.json'),
    getJSON('data/status.json'), getJSON('data/nd_results.json'), getJSON('data/national.json')
  ]);
  Object.assign(S, {site, races, news, status, nd, national, loadedAt: Date.now()});
  if(_saved === null && site?.defaultCounty && !S.county) S.county = site.defaultCounty;
  const a = document.activeElement;
  if(a && ((a.tagName === 'INPUT' && a.type === 'search') || a.tagName === 'SELECT')){ renderHeader(); return; } // don't steal focus while typing
  render();
}


/* ---------------- election-night clock ---------------- */
const POLLS_CLOSE = [ // ND polls close at 7 PM local time (source: 270toWin / ND SOS)
  {label:'7 PM Central', t:Date.UTC(2026,10,4,1,0,0)},
  {label:'7 PM Mountain', t:Date.UTC(2026,10,4,2,0,0)}
];
function dur(ms){
  const s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return `${h}h ${String(m).padStart(2,'0')}m ${String(x).padStart(2,'0')}s`;
}
function localT(t){ return new Date(t).toLocaleString([], {hour:'numeric',minute:'2-digit',timeZoneName:'short'}); }
function renderClock(){
  const now = Date.now(), el = $('#clockbox'); if(!el) return;
  const first = POLLS_CLOSE[0].t, last = POLLS_CLOSE[1].t;
  let big, lbl;
  if(now < first){ big = dur(first-now); lbl = 'until North Dakota polls begin closing'; }
  else if(now < last){ big = 'Polls closing'; lbl = 'Central-time counties closed · Mountain-time counties close in ' + dur(last-now); }
  else { big = 'Polls closed'; lbl = 'Results appear as the Secretary of State publishes them'; }
  el.innerHTML = `<div><div class="lbl">Election Day · Nov 3, 2026</div><div class="big">${esc(big)}</div></div>
    <div class="small muted">${esc(lbl)}<br>ND polls close at 7 PM local time. In your time zone: ${localT(first)} for Central-time counties, ${localT(last)} for Mountain-time counties.
    <a href="https://www.270towin.com/poll-closing-times" target="_blank" rel="noopener">All states</a></div>`;
}
function renderTopbar(){
  const now = new Date();
  $('#tbTime').textContent = 'Central time · ' + now.toLocaleString('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'}) + ' CT';
  const newest = [S.news?.generatedAt, S.status?.generatedAt, S.nd?.generatedAt].filter(Boolean).sort().pop();
  const n = (S.status?.sources||[]).filter(x=>x.ok).length;
  $('#tbUpd').textContent = newest ? `Updated ${clock(newest)} · ${n} sources live · ND results feed` : 'Waiting for first data run';
}
setInterval(()=>{ renderClock(); renderTopbar(); }, 1000);

function updatesLog(){
  const items = [];
  const st = S.status, nd = S.nd;
  if(nd?.generatedAt) items.push([nd.generatedAt, `North Dakota results feed checked${nd.officialLastUpdated?`; ND Secretary of State data last updated ${clock(nd.officialLastUpdated)}`:''}.`]);
  if(nd?.turnout?.totalPrecincts) items.push([nd.generatedAt, `${fmt(nd.turnout.precinctsReporting)} of ${fmt(nd.turnout.totalPrecincts)} precincts reporting.`]);
  if(S.news?.generatedAt) items.push([S.news.generatedAt, `News headlines refreshed from ${(st?.sources||[]).filter(x=>x.ok).length} of ${(st?.sources||[]).length} sources.`]);
  items.sort((a,b)=>b[0].localeCompare(a[0]));
  return `<h2>Latest data checks</h2><div class="card"><ul class="upd">${items.map(([t,m])=>`<li><time>${esc(clock(t))}</time>${esc(m)}</li>`).join('') || '<li>No checks yet.</li>'}</ul><div class="muted small">This shows the most recent automated checks only. It is not a history of every change.</div></div>`;
}

/* ---------------- header ---------------- */
function renderHeader(){
  renderTopbar();
  if(S.site){
    $('#siteName').textContent = S.site.name || 'Aurevane Media';
    document.title = S.site.name || 'Aurevane Media';
    $('#siteTag').textContent = S.site.tagline || '';
    $('#contact').textContent = S.site.contact ? ' Corrections: ' + S.site.contact : '';
  }
  const newest = [S.news?.generatedAt, S.status?.generatedAt, S.nd?.generatedAt].filter(Boolean).sort().pop();
  const ageMin = newest ? (Date.now() - new Date(newest).getTime())/60000 : Infinity;
  const dot = $('#dot');
  dot.className = 'dot ' + (ageMin < 20 ? 'ok' : ageMin < 60 ? 'warn' : 'bad');
  $('#fresh').textContent = newest
    ? `Data refreshed ${ago(newest)} (${clock(newest)})` + (ageMin >= 20 ? ' — feed may be delayed' : '')
    : 'Waiting for the first data run (see setup steps in README)';
}

/* ---------------- North Dakota ---------------- */
const CATS = ['Congress','Statewide','Ballot measures','Legislature','Judicial','Local'];
const CAT_TITLE = {Statewide:'Statewide offices', Legislature:'Legislature (State Senate and State House)', Judicial:'District court judges', Local:'County, city, school and local measures'};
function catOf(c){
  if(c.category) return c.category;
  if(/u\.?s\.?\s*(house|representative)|congress/i.test(c.name)) return 'Congress';
  if(/measure|amendment|initiated|referred|question/i.test(c.name)) return 'Ballot measures';
  if(/district|legislat|state (house|senate)|^house|^senate/i.test(c.name)) return 'Legislature';
  return 'Statewide';
}
function view(c, county){
  // returns the numbers to display: statewide totals, or one county's numbers
  if(!county) return {cands:c.candidates||[], total:c.totalVotes||0, pr:c.precinctsReporting, pt:c.precinctsTotal, pp:c.precinctsPartial};
  const cd = c.counties?.[county];
  if(!cd){
    if(c.inCounties?.includes(county)) return {...view(c,''), districtWide:true};
    return null;
  }
  const cands = (c.candidates||[]).map(x=>({...x, votes: cd.v?.[x.id]||0}));
  const total = cands.reduce((a,x)=>a+x.votes,0);
  cands.forEach(x=>x.pct = total ? Math.round(x.votes/total*1000)/10 : 0);
  cands.sort((a,b)=>b.votes-a.votes);
  return {cands, total, pr:cd.pr, pt:cd.pt, pp:cd.pp};
}
const isMine = (c, county) => !!(c.counties?.[county] || c.inCounties?.includes(county));
function contestCard(c, county){
  const v = view(c, county); if(!v) return '';
  const lead = v.cands[0]?.votes || 0;
  const rep = v.pt ? `${fmt(v.pr)} of ${fmt(v.pt)} precinct${v.pt===1?'':'s'} reporting${v.pp?` (+${fmt(v.pp)} partial)`:''}` : '';
  const rows = v.cands.map((x,i)=>`
    <div class="cand ${i===0 && lead>0 ? 'lead':''}">
      <span class="nm">${esc(x.name)}${x.party? ` <span class="muted small">(${esc(x.party)})</span>`:''}${x.called? ' <span class="pill">Called</span>':''}${x.winner? ' <span class="pill">Marked winner by ND SOS</span>':''}</span>
      <span>${fmt(x.votes)} · ${x.pct ?? 0}%</span>
      <div class="meter"><div class="fill" style="width:${Math.min(100,x.pct||0)}%"></div></div>
    </div>`).join('');
  return `<div class="card"><h3>${esc(c.name)}</h3><div class="muted small">${esc(rep)}${rep?' · ':''}${fmt(v.total)} votes counted${county && !v.districtWide?` in ${esc(county)} County`:''}${v.districtWide?` · district-wide totals (county split not published)`:''}${c.voteFor>1?` · vote for ${c.voteFor}`:''}</div>${rows}</div>`;
}
function matches(c, q){
  return !q || (c.name+' '+(c.candidates||[]).map(x=>x.name).join(' ')+' '+Object.keys(c.counties||{}).join(' ')+' '+(c.inCounties||[]).join(' ')).toLowerCase().includes(q);
}
function section(title, list, county, key, openByDefault, note){
  if(!list.length) return '';
  const open = S.open[key] ?? openByDefault;
  return `<details data-key="${key}" ${open?'open':''}><summary><b>${esc(title)}</b> <span class="muted small">(${list.length})</span></summary>
    ${note?`<div class="small muted" style="margin:6px 0">${note}</div>`:''}
    <div class="grid" style="margin-top:8px">${list.map(c=>contestCard(c,county)).join('')}</div></details>`;
}
function renderND(){
  const links = (S.site?.officialLinks||[]).slice(0,2).map(l=>`<a href="${safeUrl(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(' · ');
  const contests = S.nd?.contests || [];
  const q = S.ndq.toLowerCase();
  let h = `<h2>Live results</h2>`;
  if(contests.length){
    const counties = [...new Set(contests.flatMap(c=>Object.keys(c.counties||{})))].sort();
    const t = S.nd.turnout;
    const tline = t && t.totalPrecincts ? `<br><b>${fmt(t.precinctsReporting)} of ${fmt(t.totalPrecincts)} precincts reporting</b> (${Math.round((t.precinctsReporting||0)/t.totalPrecincts*1000)/10}%) · ${fmt(t.totalBallotsCast)} ballots counted · ${fmt(t.registeredVoters)} registered voters` : '';
    const off = S.nd.officialLastUpdated ? ` ND Secretary of State data last updated ${clock(S.nd.officialLastUpdated)}${S.nd.isOfficial?' (marked OFFICIAL)':' (unofficial)'}.` : '';
    h += `<div class="notice">Source: ${esc(S.nd.source)}. Checked ${ago(S.nd.generatedAt)}.${off}${tline}<br>Unofficial until certified. "Leading" is not a call: race calls come from AP, Decision Desk HQ and the official canvass. Official site: ${links}</div>`;
    h += `<div class="row">
      <label class="small">My county: <select id="county"><option value="">Statewide totals</option>${counties.map(n=>`<option ${n===S.county?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
      <input type="search" id="ndq" placeholder="Search any contest, candidate or county" value="${esc(S.ndq)}"></div>`;
    const county = S.county || '';
    const shown = contests.filter(c=>matches(c,q));
    if(county){
      const mine = shown.filter(c=>isMine(c, county));
      h += `<h2>In ${esc(county)} County</h2><p class="muted small" style="margin-top:-4px">County numbers only. Statewide races show this county's share of the vote, not the state result.</p>`;
      for(const g of CATS){
        const list = mine.filter(c=>catOf(c)===g);
        h += section(CAT_TITLE[g] || g, list, county, 'my-'+g, (g!=='Legislature' && g!=='Local' && g!=='Judicial') || list.length<=12);
      }
      h += `<h2>Statewide totals</h2>`;
    }
    const total = (g)=>shown.filter(c=>catOf(c)===g);
    for(const g of ['Congress','Statewide','Ballot measures']) h += section(CAT_TITLE[g]||g, total(g), '', 'st-'+g, true);
    h += section(CAT_TITLE.Legislature, total('Legislature'), '', 'st-Legislature', !!q,
      'Most districts elect one senator and two House members, so in a House race the top two finishers win.');
    h += section(CAT_TITLE.Judicial, total('Judicial'), '', 'st-Judicial', !!q);
    const loc = total('Local');
    h += q ? section('Local contests matching your search', loc.slice(0,60), '', 'st-Local', true, loc.length>60 ? `Showing 60 of ${loc.length}. Narrow your search.` : '')
           : `<p class="muted small">${loc.length} local contests (county offices, cities, schools, local measures) are available: choose your county above or search by name.</p>`;
    if(!shown.length) h += `<p class="muted">No contests match.</p>`;
  } else {
    h += `<div class="notice">No official results are loaded yet. Polls close at 9 PM ET. Until the official feed is connected, use the official site: ${links}</div>`;
  }

  const r = S.races?.nd;
  if(r){
    h += `<h2>Key facts</h2><div class="grid">` + r.facts.map(f=>`<div class="card"><h3>${esc(f.label)}</h3>${esc(f.text)}<div class="small muted">Source: <a href="${safeUrl(f.url)}" target="_blank" rel="noopener">${esc(f.source)}</a></div></div>`).join('') + `</div>`;
    h += `<h2>What's on North Dakota's ballot</h2>`;
    for(const g of ['Congress','Statewide','Legislature','Ballot measures','Local']){
      const list = r.races.filter(x=>x.group===g);
      if(list.length) h += `<h3 class="muted small" style="margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em">${g}</h3><div class="grid">` +
        list.map(x=>`<div class="card"><h3>${esc(x.office)}</h3>${esc(x.detail)}<div class="small muted">Source: <a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.source)}</a></div></div>`).join('') + `</div>`;
    }
  }
  const ndNews = (S.news?.items||[]).filter(i=>i.topics?.includes('North Dakota') && i.election).slice(0,14);
  h += `<h2>North Dakota headlines</h2><div class="card">` + (ndNews.length ? ndNews.map(newsItem).join('') : `<span class="muted">No North Dakota election headlines yet.</span>`) + `</div>`;
  $('#tab-north-dakota').innerHTML = h;

  const f = $('#ndq'); if(f){ f.oninput = e => { S.ndq = e.target.value; const pos = e.target.selectionStart; renderND(); const n=$('#ndq'); n.focus(); n.setSelectionRange(pos,pos); }; }
  const sel = $('#county'); if(sel){ sel.onchange = e => { S.county = e.target.value; try{ localStorage.setItem('md-county', S.county); }catch(_){} renderND(); }; }
  document.querySelectorAll('#tab-north-dakota details[data-key]').forEach(d=>d.addEventListener('toggle',()=>{ S.open[d.dataset.key] = d.open; }));
}

/* ---------------- National ---------------- */
function tile(title, d){
  if(!d) return `<div class="card tile"><h3>${title}</h3><div class="muted">No licensed results feed connected.</div></div>`;
  return `<div class="card tile"><h3>${title}</h3>
    <div class="big">${esc(d.a?.label||'A')} ${fmt(d.a?.seats)} · ${esc(d.b?.label||'B')} ${fmt(d.b?.seats)}</div>
    <div class="muted small">${d.other!=null?`Other ${fmt(d.other)} · `:''}Needed for control: ${fmt(d.needed)} · Undecided: ${fmt(d.undecided)}</div></div>`;
}
function renderNational(){
  const n = S.national;
  let h = `<div class="notice">${n ? `National totals from ${esc(n.source)}, updated ${ago(n.generatedAt)}.` :
    `National seat totals need a licensed results feed (AP or Decision Desk HQ). Until one is connected this page will not guess: use the sources below. Schema and setup are in the README.`}</div>`;
  h += `<div class="tiles">${tile('U.S. House', n?.house)}${tile('U.S. Senate', n?.senate)}</div>`;
  h += `<h2>Senate: what is at stake</h2><div class="card small">
    <p>Before the election: <b>53 Republicans, 45 Democrats and 2 independents</b> who caucus with the Democrats. <b>35 seats</b> are up (33 regular elections plus 2 specials): <b>22 held by Republicans and 13 by Democrats</b>. Democrats need a net gain of 4 for a 51-seat majority; at 50-50 the Vice President (a Republican) breaks ties.</p>
    <p class="muted">Sources: <a href="https://ballotpedia.org/United_States_Senate_elections,_2026" target="_blank" rel="noopener">Ballotpedia</a>, <a href="https://www.270towin.com/2026-senate-election/" target="_blank" rel="noopener">270toWin</a>. Calls for each race appear only once a licensed results feed is connected.</p></div>`;
  h += `<h2>House: what is at stake</h2><div class="card small"><p><b>All 435 seats</b> are on the ballot; <b>218</b> are needed for a majority. Current party counts change with vacancies and special elections, so see the Clerk of the House for the official roster: <a href="https://clerk.house.gov/Members" target="_blank" rel="noopener">clerk.house.gov</a>.</p></div>`;
  h += `<h2>Senate control calculator</h2><div class="card small">
    <p class="muted">Plain arithmetic, not a forecast. Enter how many seats change hands and see who would hold the chamber. Independents who caucus with Democrats are counted with them.</p>
    <div class="calc">
      <label>Republican-held seats won by Democrats or caucusing independents (0 to 22)<input type="number" id="cDem" min="0" max="22" value="0"></label>
      <label>Democratic-held seats won by Republicans (0 to 13)<input type="number" id="cRep" min="0" max="13" value="0"></label>
    </div>
    <div class="result" id="calcOut"></div></div>`;
  h += `<h2>Where to watch live national results</h2><div class="card">` +
    (S.site?.officialLinks||[]).map(l=>`<div><a href="${safeUrl(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></div>`).join('') + `</div>`;
  const nat = (S.news?.items||[]).filter(i=>i.election && !i.topics.includes('North Dakota') && i.group!=='Local ND').slice(0,16);
  h += `<h2>Latest national election headlines</h2><div class="card">` + (nat.length? nat.map(newsItem).join('') : `<span class="muted">No headlines yet.</span>`) + `</div>`;
  $('#tab-national').innerHTML = h;
  const calc = () => {
    const a = Math.min(22, Math.max(0, +$('#cDem').value||0)), b = Math.min(13, Math.max(0, +$('#cRep').value||0));
    const dem = 47 + a - b, rep = 53 - a + b;
    const who = rep >= 51 ? 'Republicans hold a majority' : dem >= 51 ? 'Democrats hold a majority' : (rep===50 ? 'Republicans control via the Vice President\'s tie-breaking vote' : 'Democratic caucus has 50 seats or fewer; see note');
    $('#calcOut').innerHTML = `<div class="big">${esc(who)}</div><div class="muted small">Republicans ${rep} · Democratic caucus ${dem}</div>`;
  };
  ['cDem','cRep'].forEach(id=>$('#'+id).oninput = calc); calc();
}

/* ---------------- Compare ---------------- */
function newsItem(i){
  return `<div class="item"><a href="${safeUrl(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
    <div class="meta">${esc(i.source)}${i.published? ' · '+ago(i.published):''}${(i.topics||[]).slice(0,3).map(t=>` <span class="pill">${esc(t)}</span>`).join('')}</div></div>`;
}
const GROUP_ORDER = ['Wire & public media','Left-leaning','Center / mixed','Right-leaning','Local ND'];
function renderCompare(){
  const items = (S.news?.items || []).filter(i => (i.section || 'politics') === 'politics');
  const topics = ['All', ...[...new Set(items.flatMap(i=>i.topics||[]))].sort()];
  const q = S.q.toLowerCase();
  const filtered = items.filter(i =>
    (!S.electionOnly || i.election) &&
    (S.topic==='All' || i.topics?.includes(S.topic)) &&
    (!q || i.title.toLowerCase().includes(q)));
  let h = `<div class="notice">Same story, different outlets. Pick a topic to see how each group of sources is covering it. Groupings are a rough starting point, not a rating, and are editable in config/sources.json.</div>`;
  h += `<div class="row">` + topics.map(t=>`<button class="chip" data-topic="${esc(t)}" aria-pressed="${S.topic===t}">${esc(t)}</button>`).join('') + `</div>`;
  h += `<div class="row"><input type="search" id="q" placeholder="Search headlines" value="${esc(S.q)}">
        <label class="small"><input type="checkbox" id="eo" ${S.electionOnly?'checked':''}> Election-related only</label>
        <span class="muted small">${filtered.length} headlines</span></div>`;
  const groups = GROUP_ORDER.concat([...new Set(items.map(i=>i.group))].filter(g=>!GROUP_ORDER.includes(g)));
  h += `<div class="cols">` + groups.map(g=>{
    const list = filtered.filter(i=>i.group===g).slice(0,10);
    return `<div class="col card"><h3>${esc(g)} <span class="muted small">(${filtered.filter(i=>i.group===g).length})</span></h3>${list.length? list.map(newsItem).join('') : '<span class="muted small">Nothing matching right now.</span>'}</div>`;
  }).join('') + `</div>`;
  $('#tab-compare').innerHTML = h;
  document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{S.topic=b.dataset.topic;renderCompare();});
  const qi=$('#q'); qi.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;renderCompare();const n=$('#q');n.focus();n.setSelectionRange(p,p);};
  $('#eo').onchange=e=>{S.electionOnly=e.target.checked;renderCompare();};
}

/* ---------------- Higher Ed / AI & Data ---------------- */
const NEWS_TABS = {
  highered: {title:'Higher Education & Financial Aid', intro:'Headlines on financial aid, student loans, college policy and funding, plus North Dakota campuses. Headlines link to the publishers; no article text is copied.',
    links:[['Federal Student Aid','https://studentaid.gov/'],['U.S. Department of Education','https://www.ed.gov/'],['North Dakota University System','https://ndus.edu/']]},
  ai: {title:'AI & Data', intro:'Headlines on artificial intelligence, data and privacy, policy and the businesses behind them. Company announcements are labeled separately from press coverage.',
    links:[]}
};
const nq = {highered:'', ai:''}, ntopic = {highered:'All', ai:'All'};
function renderNewsTab(sec){
  const cfg = NEWS_TABS[sec], items = (S.news?.items||[]).filter(i=>i.section===sec);
  const topics = ['All', ...[...new Set(items.flatMap(i=>i.topics||[]))].sort()];
  const q = nq[sec].toLowerCase();
  const f = items.filter(i => (ntopic[sec]==='All' || i.topics?.includes(ntopic[sec])) && (!q || i.title.toLowerCase().includes(q)));
  let h = `<h2>${esc(cfg.title)}</h2><div class="notice">${esc(cfg.intro)}${cfg.links.length? '<br>Official: '+cfg.links.map(([l,u])=>`<a href="${safeUrl(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join(' · '):''}</div>`;
  if(!items.length){ h += `<div class="card muted">No headlines yet. They appear after the next data run; if this stays empty, check the Sources tab for failing feeds.</div>`; $('#tab-'+sec).innerHTML = h; return; }
  h += `<div class="row">${topics.map(t=>`<button class="chip" data-nt="${esc(t)}" aria-pressed="${ntopic[sec]===t}">${esc(t)}</button>`).join('')}</div>`;
  h += `<div class="row"><input type="search" id="nq-${sec}" placeholder="Search headlines" value="${esc(nq[sec])}"><span class="muted small">${f.length} headlines</span></div>`;
  const groups = [...new Set(items.map(i=>i.group))];
  h += `<div class="cols">` + groups.map(g=>{ const all=f.filter(i=>i.group===g);
    return `<div class="col card"><h3>${esc(g)} <span class="muted small">(${all.length})</span></h3>${all.slice(0,12).map(newsItem).join('') || '<span class="muted small">Nothing matching right now.</span>'}</div>`; }).join('') + `</div>`;
  $('#tab-'+sec).innerHTML = h;
  document.querySelectorAll('#tab-'+sec+' [data-nt]').forEach(b=>b.onclick=()=>{ ntopic[sec]=b.dataset.nt; renderNewsTab(sec); });
  const qi = $('#nq-'+sec); qi.oninput = e=>{ nq[sec]=e.target.value; const p=e.target.selectionStart; renderNewsTab(sec); const n=$('#nq-'+sec); n.focus(); n.setSelectionRange(p,p); };
}

/* ---------------- Updates ---------------- */
function renderUpdates(){
  const st = S.status?.sources || [];
  const by = {}; st.forEach(x=>{ const k=x.section||'politics'; (by[k] ||= {ok:0,n:0}); by[k].n++; if(x.ok) by[k].ok++; });
  const lab = {politics:'Politics & elections', highered:'Higher Ed', ai:'AI & Data'};
  let h = updatesLog();
  h += `<h2>Source health</h2><div class="card small">` + (Object.keys(by).length ? Object.entries(by).map(([k,v])=>`<div>${esc(lab[k]||k)}: ${v.ok} of ${v.n} sources working</div>`).join('') : 'No data run yet.') + `<div class="muted">Details for each source are on the Sources &amp; method tab.</div></div>`;
  $('#tab-updates').innerHTML = h;
}

/* ---------------- Voting ---------------- */
function renderVoting(){
  const L = [['North Dakota voter information (vote.nd.gov)','https://vote.nd.gov/'],['North Dakota official election results','https://resultsnd.sos.nd.gov/'],['How to vote in any state (USA.gov)','https://www.usa.gov/how-to-vote']];
  $('#tab-voting').innerHTML = `<h2>Voting information</h2><div class="notice">Rules and polling places are set by each state. Use the official sources below for your own situation; this site does not store or ask for any personal information.</div>
    <div class="card">${L.map(([l,u])=>`<div><a href="${safeUrl(u)}" target="_blank" rel="noopener">${esc(l)}</a></div>`).join('')}</div>
    <div class="card small">North Dakota polls close at 7 PM local time. Anyone in line at closing time is allowed to vote under general U.S. practice; confirm your local rules with your county election office.</div>`;
}

/* ---------------- Sources ---------------- */
function renderSources(){
  const st = S.status?.sources || [];
  const bad = st.filter(s=>!s.ok).length;
  let h = `<div class="notice">Every source is checked on each update. Red means that feed failed on the last run, so you can see gaps instead of silently missing a side of the story. ${st.length? `${st.length-bad} of ${st.length} sources working.`:''}</div>`;
  h += `<div class="card"><table><thead><tr><th>Source</th><th>Group</th><th>Status</th><th>Items</th><th>Last checked</th></tr></thead><tbody>` +
    (st.length? st.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.group)}</td>
      <td>${s.ok? '<span class="dot ok"></span>OK' : `<span class="dot bad"></span>${esc(s.error||'failed')}`}</td><td>${s.count}</td><td>${ago(s.fetchedAt)}</td></tr>`).join('')
      : `<tr><td colspan="5" class="muted">No data run yet.</td></tr>`) + `</tbody></table></div>`;
  h += `<h2>Method</h2><div class="card small">
    <p><b>What this is.</b> A feed of official results plus headlines from many outlets, shown side by side. No article text is copied; every headline links to its publisher.</p>
    <p><b>Results.</b> North Dakota numbers come straight from the Secretary of State's results export. They are unofficial until canvassed. We label "leading" separately from "called", and we do not make our own calls.</p>
    <p><b>Topics.</b> Topic tags come from simple keyword rules in <code>scripts/update.mjs</code>. They can miss or over-match; they are filters, not judgments.</p>
    <p><b>Independence.</b> No party, campaign or PAC funds or directs this site. Corrections: ${esc(S.site?.contact||'')}.</p></div>`;
  $('#tab-sources').innerHTML = h;
}

/* ---------------- routing / loop ---------------- */
function render(){
  renderHeader(); renderClock(); renderND(); renderNational(); renderNewsTab('highered'); renderNewsTab('ai'); renderCompare(); renderUpdates(); renderVoting(); renderSources();
}
function showTab(name){
  if(!TABS.includes(name)) name = 'north-dakota';
  TABS.forEach(t=>{ $('#tab-'+t).hidden = t!==name; });
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===name));
  if(location.hash !== '#'+name) history.replaceState(null,'','#'+name);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
window.addEventListener('hashchange',()=>showTab(location.hash.slice(1)));
$('#refreshNow').onclick = () => { countdown = REFRESH_SECONDS; loadAll(); };

let countdown = REFRESH_SECONDS;
setInterval(()=>{
  countdown--;
  $('#next').textContent = `Page re-checks in ${countdown}s`;
  if(S.loadedAt) renderHeader();
  if(countdown <= 0){ countdown = REFRESH_SECONDS; loadAll(); }
}, 1000);

showTab(location.hash.slice(1));
loadAll();
</script>
</body>
</html>
